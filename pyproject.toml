# SPDX-License-Identifier: LicenseRef-MEMORY-NC-Research-1.0
[project]
name = "memory-spaced-repetition"
version = "0.0.1"
description = "MEMORY: simulation study of forgetting models and review schedules under a fixed study budget"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Mohamed Bechir Kefi" }]
dependencies = [
    "numpy>=2.1",
    "jsonschema>=4.23",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.112",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memory_research"]

[tool.uv]
# Every locked version must have been released at least two weeks before 2026-11-24 (decision D-005).
exclude-newer = "2026-11-10T00:00:00Z"

[tool.pytest.ini_options]
testpaths = ["tests"]
